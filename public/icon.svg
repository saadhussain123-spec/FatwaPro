<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="emeraldGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#166534" />
      <stop offset="100%" stop-color="#0F3D22" />
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="104" fill="url(#emeraldGrad)" />

  <!-- 8-pointed Rub el Hizb geometric border -->
  <rect
    x="104"
    y="104"
    width="304"
    height="304"
    rx="14"
    fill="none"
    stroke="#D9B99B"
    stroke-width="10"
    opacity="0.85"
  />
  <rect
    x="104"
    y="104"
    width="304"
    height="304"
    rx="14"
    fill="none"
    stroke="#D9B99B"
    stroke-width="10"
    transform="rotate(45 256 256)"
    opacity="0.85"
  />

  <!-- Inner octagonal dark backing for high contrast -->
  <circle cx="256" cy="256" r="136" fill="#0F3D22" stroke="#D9B99B" stroke-width="5" opacity="0.95" />

  <!-- Crescent (Hilal) above the open manuscript -->
  <path
    d="M276 164 A34 34 0 1 0 276 218 A26 26 0 1 1 276 164 Z"
    fill="#D9B99B"
  />

  <!-- Open Mushaf / Manuscript pages -->
  <path
    d="M256 242 C230 226 196 226 166 238 L166 324 C196 312 230 314 256 330 C282 314 316 312 346 324 L346 238 C316 226 282 226 256 242 Z"
    fill="#FBF9F5"
  />
  <!-- Book center spine crease -->
  <line x1="256" y1="242" x2="256" y2="330" stroke="#14532D" stroke-width="6" stroke-linecap="round" />

  <!-- Rehal (bookstand) support legs -->
  <path
    d="M196 342 L256 328 L316 342"
    fill="none"
    stroke="#D9B99B"
    stroke-width="10"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
</svg>
